<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#34322D" />
      <stop offset="100%" stop-color="#1A1917" />
    </radialGradient>

    <!-- Metallic Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF7E7" />
      <stop offset="25%" stop-color="#E5C77A" />
      <stop offset="60%" stop-color="#B69A68" />
      <stop offset="85%" stop-color="#8C703C" />
      <stop offset="100%" stop-color="#CBB178" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A3E" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Crest -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Base -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" />
  
  <!-- Outer Filigree Border -->
  <rect x="7" y="7" width="114" height="114" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.8" />
  <rect x="11" y="11" width="106" height="106" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="3,3" stroke-opacity="0.5" />

  <!-- Corner Accent Dots -->
  <circle cx="20" cy="20" r="1.5" fill="url(#goldGrad)" />
  <circle cx="108" cy="20" r="1.5" fill="url(#goldGrad)" />
  <circle cx="20" cy="108" r="1.5" fill="url(#goldGrad)" />
  <circle cx="108" cy="108" r="1.5" fill="url(#goldGrad)" />

  <g filter="url(#softGlow)">
    <!-- Central Crest Diamond Star -->
    <path d="M64 24 L66.5 32 L74.5 34.5 L66.5 37 L64 45 L61.5 37 L53.5 34.5 L61.5 32 Z" fill="url(#goldAccent)" />
    <circle cx="64" cy="34.5" r="1.2" fill="#FFFFFF" />

    <!-- Fancy Interlocking 'V' Monogram -->
    <!-- Left Bold Stem of V -->
    <path d="M33 42 
             L45 42 
             L64 89 
             L56 89 
             Z" 
          fill="url(#goldGrad)" />

    <!-- Left Serifs -->
    <path d="M30 42 L48 42 L45 45 L33 45 Z" fill="url(#goldAccent)" />

    <!-- Right Hairline / Faceted Stem of V -->
    <path d="M95 42 
             L83 42 
             L61 93 
             L66.5 93 
             Z" 
          fill="url(#goldAccent)" 
          opacity="0.95" />

    <!-- Right Serif -->
    <path d="M80 42 L98 42 L95 45 L83 45 Z" fill="url(#goldGrad)" />

    <!-- Apex Point Base Shimmer -->
    <polygon points="59,88 64,100 69,88 64,91" fill="url(#goldAccent)" />

    <!-- Intersecting Chevron Ribbon Detail inside V -->
    <path d="M49 56 L64 78 L79 56" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    
    <!-- Small lower diamond -->
    <polygon points="64,103 66,106 64,109 62,106" fill="url(#goldGrad)" />
  </g>
</svg>

